<!--Evaluator modular version-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Smart Evaluator</title>
</head>
<body>
<div class="page">

  <!-- ======================
       HEADER SECTION
       Includes logo, subtitle, and theme toggle buttons
       ====================== -->
  <header class="page__header">

    <!-- Logo and subtitle -->
    <div class="page__header-logo">
      <span class="page__header-logo-text">Smart Evaluator</span>
      <span class="page__header-logo-subtitle">Real Time Voice Command Enabled</span>
    </div>

    <!-- Theme toggle buttons -->
    <div class="js-header-toggle">
      <div class="header-toggle__border">
        <button type="button" class="header-toggle__btn js-theme-toggle-btn js-toggle-btn" data-toggle="true" data-value="dark">Dark</button>
        <button type="button" class="header-toggle__btn js-theme-toggle-btn js-toggle-btn" data-toggle="true" data-value="light">Light</button>
      </div>
    </div>
  </header>

  <!-- ======================
       MAIN EVALUATION SECTION
       Contains left input panel and right history panel
       ====================== -->
  <div class="page__evaluation">

    <!-- LEFT PANEL: Input, messages, voice input, buttons -->
    <main class="left-part">

      <!-- Error / status messages -->
      <div class="left-part__message">
        <div class="left-part__message-title">Message: </div>
        <div class="left-part__error-message js-error-message">All is well</div>
      </div>

      <!-- Editable expression input display -->
      <div class="left-part__input-display js-input-display" contenteditable="true" role="textbox" aria-label="expression input"></div>

      <!-- Voice input button -->
      <div class="left-part__voice-input">
        <button type="button" class="left-part__voice-input-btn">Voice Input</button>
      </div>

      <!-- BUTTONS: grouped by functionality -->
      <div class="left-part__buttons">

        <!-- First block: Logarithms, exponents, roots, constants -->
        <div class="left-part__buttons-block left-part__buttons-block--first">

          <!-- Logarithm buttons -->
          <div class="buttons-block__row buttons-block__row--logarithm">
            <button type="button" class="btn btn--log-box"><span>log<sub class="expBox-icon">□</sub></span></button>
            <button type="button" class="btn btn--log"><span>log</span></button>
            <button type="button" class="btn btn--ln"><span>ln</span></button>
          </div>

          <!-- Exponent and factorial buttons -->
          <div class="buttons-block__row buttons-block__row--exponent-and-factorial">
            <button type="button" class="btn btn--x-box"><span>x<sup class="expBox-icon">□</sup></span></button>
            <button type="button" class="btn btn--x-square"><span>x<sup>2</sup></span></button>
            <button type="button" class="btn btn--factorial"><span class="factorial-icon">!</span></button>
          </div>

          <!-- Root and Pi buttons -->
          <div class="buttons-block__row buttons-block__row--root-and-pi">
            <button type="button" class="btn btn--root-box"><span class="root-Symbol"><sup class="expBox-icon">□</sup>√</span></button>
            <button type="button" class="btn btn--root"><span class="root-Symbol">√</span></button>
            <button type="button" class="btn btn--pi"><span>π</span></button>
          </div>

          <!-- Combinatorics and constant e -->
          <div class="buttons-block__row buttons-block__row--combinatorics-and-e">
            <button type="button" class="btn btn--combination"><span><sup>n</sup>C<sub>r</sub></span></button>
            <button type="button" class="btn btn--permutation"><span><sup>n</sup>P<sub>r</sub></span></button>
            <button type="button" class="btn btn--e"><span>e</span></button>
          </div>
        </div>

        <!-- Second block: Trigonometric buttons and RAD/DEG toggle -->
        <div class="left-part__buttons-block left-part__buttons-block--second">

          <!-- RAD/DEG toggle -->
          <div class="buttons-block__row buttons-block__row--rad-deg-toggle">
            <div class="buttons-block__rad-deg-toggle-group js-rad-deg-toggle-group">
              <button type="button" class="btn btn--radian js-toggle-btn" data-toggle="true" data-value="rad"><span>rad</span></button>
              <button type="button" class="btn btn--degree js-toggle-btn active-toggle-btn" data-toggle="true" data-value="deg"><span>deg</span></button>
            </div>
          </div>

          <!-- Trigonometric functions -->
          <div class="buttons-block__row buttons-block__row--sin-cot">
            <button type="button" class="btn btn--sin"><span>sin</span></button>
            <button type="button" class="btn btn--cot"><span>cot</span></button>
          </div>
          <div class="buttons-block__row buttons-block__row--cos-sec">
            <button type="button" class="btn btn--cos"><span>cos</span></button>
            <button type="button" class="btn btn--sec"><span>sec</span></button>
          </div>
          <div class="buttons-block__row buttons-block__row--tan-csc">
            <button type="button" class="btn btn--tan"><span>tan</span></button>
            <button type="button" class="btn btn--csc"><span>csc</span></button>
          </div>
        </div>

        <!-- Third block: Numbers and basic operations -->
        <div class="left-part__buttons-block left-part__buttons-block--third">
          <div class="buttons-block__row buttons-block__row--number-and-divide">
            <button type="button" class="btn btn--seven"><span>7</span></button>
            <button type="button" class="btn btn--eight"><span>8</span></button>
            <button type="button" class="btn btn--nine"><span>9</span></button>
            <button type="button" class="btn btn--divide"><span class="divide-symbol">/</span></button>
          </div>
          <div class="buttons-block__row buttons-block__row--number-and-multiply">
            <button type="button" class="btn btn--four"><span>4</span></button>
            <button type="button" class="btn btn--five"><span>5</span></button>
            <button type="button" class="btn btn--six"><span>6</span></button>
            <button type="button" class="btn btn--multiply"><span>×</span></button>
          </div>
          <div class="buttons-block__row buttons-block__row--number-and-minus">
            <button type="button" class="btn btn--one"><span>1</span></button>
            <button type="button" class="btn btn--two"><span>2</span></button>
            <button type="button" class="btn btn--three"><span>3</span></button>
            <button type="button" class="btn btn--minus"><span class="minus-symbol">-</span></button>
          </div>
          <div class="buttons-block__row buttons-block__row--zero-dot-percent-plus">
            <button type="button" class="btn btn--zero"><span>0</span></button>
            <button type="button" class="btn btn--dot"><span>.</span></button>
            <button type="button" class="btn btn--percent"><span>%</span></button>
            <button type="button" class="btn btn--plus"><span>+</span></button>
          </div>
        </div>

        <!-- Fourth block: Special buttons (AC, arrows, brackets, delete, equal) -->
        <div class="left-part__buttons-block left-part__buttons-block--fourth">

          <!-- AC button -->
          <div class="buttons-block__row buttons-block__row--ac">
            <button class="btn btn--ac"><span>AC</span></button>
          </div>

          <!-- Cursor movement buttons -->
          <div class="buttons-block__row buttons-block__row--left-right-arrow">

            <!-- Left arrow button -->
            <button type="button" class="btn btn--left-arrow js-left-arrow" data-value="left-arrow">
              <span>
                <!-- Left arrow SVG icon -->
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="800px" viewBox="0 -6.5 38 38" version="1.1">
      
                    <title>left-arrow</title>
                    <desc>Created with Sketch.</desc>
                    <g id="icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                        <g id="ui-gambling-website-lined-icnos-casinoshunter" transform="translate(-1641.000000, -158.000000)" fill="currentColor" fill-rule="nonzero">
                            <g id="1" transform="translate(1350.000000, 120.000000)">
                                <path d="M317.812138,38.5802109 L328.325224,49.0042713 L328.41312,49.0858421 C328.764883,49.4346574 328.96954,49.8946897 329,50.4382227 L328.998248,50.6209428 C328.97273,51.0514917 328.80819,51.4628128 328.48394,51.8313977 L328.36126,51.9580208 L317.812138,62.4197891 C317.031988,63.1934036 315.770571,63.1934036 314.990421,62.4197891 C314.205605,61.6415481 314.205605,60.3762573 314.990358,59.5980789 L322.274264,52.3739093 L292.99947,52.3746291 C291.897068,52.3746291 291,51.4850764 291,50.3835318 C291,49.2819872 291.897068,48.3924345 292.999445,48.3924345 L322.039203,48.3917152 L314.990421,41.4019837 C314.205605,40.6237427 314.205605,39.3584519 314.990421,38.5802109 C315.770571,37.8065964 317.031988,37.8065964 317.812138,38.5802109 Z" id="left-arrow" transform="translate(310.000000, 50.500000) scale(-1, 1) translate(-310.000000, -50.500000) ">

                                </path>
                            </g>
                        </g>
                    </g>
                </svg>
              </span>
            </button>

            <!-- right arrow button -->
            <button type="button" class="btn btn--right-arrow js-right-arrow" data-value="right-arrow">
              <span>
                <!-- right arrow SVG icon -->
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="800px" viewBox="0 -6.5 38 38" version="1.1">
      
                    <title>right-arrow</title>
                    <desc>Created with Sketch.</desc>
                    <g id="icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                        <g id="ui-gambling-website-lined-icnos-casinoshunter" transform="translate(-1511.000000, -158.000000)" fill="currentColor" fill-rule="nonzero">
                            <g id="1" transform="translate(1350.000000, 120.000000)">
                                <path d="M187.812138,38.5802109 L198.325224,49.0042713 L198.41312,49.0858421 C198.764883,49.4346574 198.96954,49.8946897 199,50.4382227 L198.998248,50.6209428 C198.97273,51.0514917 198.80819,51.4628128 198.48394,51.8313977 L198.36126,51.9580208 L187.812138,62.4197891 C187.031988,63.1934036 185.770571,63.1934036 184.990421,62.4197891 C184.205605,61.6415481 184.205605,60.3762573 184.990358,59.5980789 L192.274264,52.3739093 L162.99947,52.3746291 C161.897068,52.3746291 161,51.4850764 161,50.3835318 C161,49.2819872 161.897068,48.3924345 162.999445,48.3924345 L192.039203,48.3917152 L184.990421,41.4019837 C184.205605,40.6237427 184.205605,39.3584519 184.990421,38.5802109 C185.770571,37.8065964 187.031988,37.8065964 187.812138,38.5802109 Z" id="right-arrow">

                                </path>
                            </g>
                        </g>
                    </g>
                </svg>
              </span>
            </button>
          </div>

          <!-- Brackets and delete button -->
          <div class="buttons-block__row buttons-block__row--brackets-and-delete">

            <!-- Brackets button: allows users to group open bracket and close bracket -->
            <button type="button" class="btn btn--brackets"><span>()</span></button>

            <!-- delete button -->
            <button type="button" class="btn btn--delete-btn js-delete-btn" data-value="delete">
              <span class="delete-btn-span">
                <!-- Delete icon SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="800px" viewBox="0 -2 20 20" version="1.1" fill="#000000" transform="matrix(-1, 0, 0, 1, 0, 0)">

                  <g id="SVGRepo_bgCarrier" stroke-width="0"/>

                  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>

                  <g id="SVGRepo_iconCarrier"> <title>content / 40 - content, tag, remove icon</title> <g id="Free-Icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round"> <g transform="translate(-673.000000, -454.000000)" id="Group" stroke="currentColor" stroke-width="2"> <g transform="translate(671.000000, 450.000000)" id="Shape"> <path d="M4,5 L16.4661235,5 C16.8116064,5 17.1326181,5.16842182 17.3151526,5.445451 L21,12 L17.3151526,18.554549 C17.1326181,18.8315782 16.8116064,19 16.4661235,19 L4,19 C3.44771525,19 3,18.5771583 3,18.055556 L3,5.944444 C3,5.42284174 3.44771525,5 4,5 Z"> </path> <path d="M14.5,9 L8.5,15 M14.5,15 L8.5,9"> </path> </g> </g> </g> </g>

                </svg>
              </span>
            </button>
          </div>

          <!-- Equal button -->
          <div class="buttons-block__row buttons-block__row--equal">
            <button type="button" class="btn btn--equal"><span>=</span></button>
          </div>
        </div>
      </div>
    </main>

    <!-- RIGHT PANEL: Evaluation history -->
    <aside class="right-part">

      <!-- History title and remove button -->
      <div class="right-part__history-title">
        <div class="right-part__history-title-text">
          <span>History Panel</span>
          <div class="right-part__history-underline"></div>
        </div>
        <div class="right-part__history-remove-btn right-part__history-remove-btn--hidden js-history-remove-btn">
          <button type="button">Remove History</button>
        </div>
      </div>

      <!-- History list -->
      <div class="right-part__history-list js-history-list">
        <!-- JS will populate history items here -->
      </div>
    </aside>
  </div>
</div>


<!-- Main JS Module -->
<script type="module" src="js/main.js"></script>
</body>
</html>
