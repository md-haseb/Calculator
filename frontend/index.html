<!--Calculator modular version-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Calculator By Md Haseb</title>
</head>
<body>
<div class="container">
  <div class="header_container">
    <div class="logo">
      <span class="logo_text">Smart Evaluator</span>
      <span class="sub_title">Real Time Voice Command Enabled</span>
    </div>
    <div class="theme_toggle">
      <div class="theme_toggle_border">
        <button class="theme_toggle_btn toggleBtn" data-toggle="true" data-value="dark">Dark</button><button class="theme_toggle_btn toggleBtn " data-toggle="true" data-value="light">Light</button>
      </div>
    </div>
  </div>
  <div class="evaluation_container">
    <div class="left_part">
      <div class="msg_display_container">
        <div class="message_title">Message: </div>
        <div class="error_message">All is well</div>
      </div>
      <div class="input_display" contenteditable="true"></div>
      <div class="voice_input_container">
        <button class="voice_input_btn">Voice Input</button>
      </div>
      <div class="button_container">
        <div class="button_block button_block_1">
          <div class="button_row block_1_first_row">
            <button class="btn block_1_button log_box"><span>log<sub class="expBox_icon">□</sub></span></button>
            <button class="btn block_1_button log"><span>log</span></button>
            <button class="btn block_1_button ln"><span>ln</span></button>
          </div>
          <div class="button_row block_1_second_row">
            <button class="btn block_1_button x_box"><span>x<sup class="expBox_icon">□</sup></span></button>
            <button class="btn block_1_button x_square"><span>x<sup>2</sup></span></button>
            <button class="btn block_1_button factorial"><span class="factorial_icon">!</span></button>
          </div>
          <div class="button_row block_1_third_row">
            <button class="btn block_1_button root_box"><span class="root_Symbol"><sup class="expBox_icon">□</sup>√</span></button>
            <button class="btn block_1_button root"><span class="root_Symbol">√</span></button>
            <button class="btn block_1_button pi"><span>π</span></button>
          </div>
          <div class="button_row block_1_fourth_row">
            <button class="btn block_1_button epsilon"><span><sup>n</sup>C<sub>r</sub></span></button>
            <button class="btn block_1_button phi"><span><sup>n</sup>P<sub>r</sub></span></button>
            <button class="btn block_1_button pi"><span>e</span></button>
          </div>
        </div>
        <div class="button_block button_block_2">
          <div class="button_row block_2_first_row">
            <div class="radDegToggle">
              <button class="btn block_2_button rad_deg_toggle_btn toggleBtn radian" data-toggle="true" data-value="rad"><span>rad</span></button><button class="btn block_2_button rad_deg_toggle_btn toggleBtn degree active_toggle_btn" data-toggle="true" data-value="deg"><span>deg</span></button>
            </div>
          </div>
          <div class="button_row block_2_second_row">
            <button class="btn block_2_button sin"><span>sin</span></button>
            <button class="btn block_2_button cot"><span>cot</span></button>
          </div>
          <div class="button_row block_2_third_row">
            <button class="btn block_2_button cos"><span>cos</span></button>
            <button class="btn block_2_button sec"><span>sec</span></button>
          </div>
          <div class="button_row block_2_fourth_row">
            <button class="btn block_2_button tan"><span>tan</span></button>
            <button class="btn block_2_button csc"><span>csc</span></button>
          </div>
        </div>
        <div class="button_block button_block_3">
          <div class="button_row block_3_first_row">
            <button class="btn block_3_button seven"><span>7</span></button>
            <button class="btn block_3_button eight"><span>8</span></button>
            <button class="btn block_3_button nine"><span>9</span></button>
            <button class="btn block_3_button divide"><span class="divide_symbol">/</span></button>
          </div>
          <div class="button_row block_3_second_row">
            <button class="btn block_3_button four"><span>4</span></button>
            <button class="btn block_3_button five"><span>5</span></button>
            <button class="btn block_3_button six"><span>6</span></button>
            <button class="btn block_3_button multiply"><span>×</span></button>
          </div>
          <div class="button_row block_3_third_row">
            <button class="btn block_3_button one"><span>1</span></button>
            <button class="btn block_3_button two"><span>2</span></button>
            <button class="btn block_3_button three"><span>3</span></button>
            <button class="btn block_3_button minus"><span class="mimus_symbol">-</span></button>
          </div>
          <div class="button_row block_3_fourth_row">
            <button class="btn block_3_button zero"><span>0</span></button>
            <button class="btn block_3_button dot"><span>.</span></button>
            <button class="btn block_3_button percent"><span>%</span></button>
            <button class="btn block_3_button plus"><span>+</span></button>
          </div>
        </div>
        <div class="button_block button_block_4">
          <div class="button_row block_4_first_row">
            <button class="btn block_4_button ac"><span>AC</span></button>
          </div>
          <div class="button_row block_4_second_row">
            <button class="btn block_4_button left_arrow" data-value="left-arrow">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="800px" viewBox="0 -6.5 38 38" version="1.1">
      
                    <title>left-arrow</title>
                    <desc>Created with Sketch.</desc>
                    <g id="icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                        <g id="ui-gambling-website-lined-icnos-casinoshunter" transform="translate(-1641.000000, -158.000000)" fill="currentColor" fill-rule="nonzero">
                            <g id="1" transform="translate(1350.000000, 120.000000)">
                                <path d="M317.812138,38.5802109 L328.325224,49.0042713 L328.41312,49.0858421 C328.764883,49.4346574 328.96954,49.8946897 329,50.4382227 L328.998248,50.6209428 C328.97273,51.0514917 328.80819,51.4628128 328.48394,51.8313977 L328.36126,51.9580208 L317.812138,62.4197891 C317.031988,63.1934036 315.770571,63.1934036 314.990421,62.4197891 C314.205605,61.6415481 314.205605,60.3762573 314.990358,59.5980789 L322.274264,52.3739093 L292.99947,52.3746291 C291.897068,52.3746291 291,51.4850764 291,50.3835318 C291,49.2819872 291.897068,48.3924345 292.999445,48.3924345 L322.039203,48.3917152 L314.990421,41.4019837 C314.205605,40.6237427 314.205605,39.3584519 314.990421,38.5802109 C315.770571,37.8065964 317.031988,37.8065964 317.812138,38.5802109 Z" id="left-arrow" transform="translate(310.000000, 50.500000) scale(-1, 1) translate(-310.000000, -50.500000) ">

                                </path>
                            </g>
                        </g>
                    </g>
                </svg>
              </span>
            </button>
            <!-- <button class="btn block_4_button right_arrow"><span><img src="arrow.png" alt="right_arrow"></span></button> -->
            <button class="btn block_4_button right_arrow" data-value="right-arrow">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="800px" viewBox="0 -6.5 38 38" version="1.1">
      
                    <title>right-arrow</title>
                    <desc>Created with Sketch.</desc>
                    <g id="icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                        <g id="ui-gambling-website-lined-icnos-casinoshunter" transform="translate(-1511.000000, -158.000000)" fill="currentColor" fill-rule="nonzero">
                            <g id="1" transform="translate(1350.000000, 120.000000)">
                                <path d="M187.812138,38.5802109 L198.325224,49.0042713 L198.41312,49.0858421 C198.764883,49.4346574 198.96954,49.8946897 199,50.4382227 L198.998248,50.6209428 C198.97273,51.0514917 198.80819,51.4628128 198.48394,51.8313977 L198.36126,51.9580208 L187.812138,62.4197891 C187.031988,63.1934036 185.770571,63.1934036 184.990421,62.4197891 C184.205605,61.6415481 184.205605,60.3762573 184.990358,59.5980789 L192.274264,52.3739093 L162.99947,52.3746291 C161.897068,52.3746291 161,51.4850764 161,50.3835318 C161,49.2819872 161.897068,48.3924345 162.999445,48.3924345 L192.039203,48.3917152 L184.990421,41.4019837 C184.205605,40.6237427 184.205605,39.3584519 184.990421,38.5802109 C185.770571,37.8065964 187.031988,37.8065964 187.812138,38.5802109 Z" id="right-arrow">

                                </path>
                            </g>
                        </g>
                    </g>
                </svg>
              </span>
            </button>
          </div>
          <div class="button_row block_4_third_row">
            <button class="btn block_4_button brackets"><span>()</span></button>
            <button class="btn block_4_button delete_btn" data-value="delete">
              <span class="delete_btn_span">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="800px" viewBox="0 -2 20 20" version="1.1" fill="#000000" transform="matrix(-1, 0, 0, 1, 0, 0)">

                  <g id="SVGRepo_bgCarrier" stroke-width="0"/>

                  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>

                  <g id="SVGRepo_iconCarrier"> <title>content / 40 - content, tag, remove icon</title> <g id="Free-Icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round"> <g transform="translate(-673.000000, -454.000000)" id="Group" stroke="currentColor" stroke-width="2"> <g transform="translate(671.000000, 450.000000)" id="Shape"> <path d="M4,5 L16.4661235,5 C16.8116064,5 17.1326181,5.16842182 17.3151526,5.445451 L21,12 L17.3151526,18.554549 C17.1326181,18.8315782 16.8116064,19 16.4661235,19 L4,19 C3.44771525,19 3,18.5771583 3,18.055556 L3,5.944444 C3,5.42284174 3.44771525,5 4,5 Z"> </path> <path d="M14.5,9 L8.5,15 M14.5,15 L8.5,9"> </path> </g> </g> </g> </g>

                </svg>
              </span>
            </button>
          </div>
          <div class="button_row block_4_fourth_row">
            <button class="btn block_4_button equal"><span>=</span></button>
          </div>
        </div>
      </div>
    </div>
    <div class="right_part">
      <div class="history_title_container">
        <div class="history_title">
          <span>History Panel</span>
          <div class="history_underline"></div>
        </div>
        <div class="history_remove_btn remove_btn_visibility">
          <button>Remove History</button>
        </div>
      </div>
      <div class="history_list_container">

      </div>
    </div>
  </div>
</div>

  <!-- <script src="script.js"></script> -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
